# Build APK "Kopi Drip Kasir" otomatis (folder android/).
#
# Hasil: tab Actions → run terbaru → bagian "Artifacts" → unduh KopiDripKasir-apk.
#
# Tanda tangan tetap (supaya update APK bisa dipasang di atas versi lama):
# isi 2 GitHub Secrets di Settings → Secrets and variables → Actions:
#   KOPIDRIP_KEYSTORE_BASE64   — isi file keystore (.p12) dalam base64
#   KOPIDRIP_KEYSTORE_PASSWORD — password keystore
# Tanpa secrets, yang dibuat APK "debug" (bisa dipasang untuk uji coba, tapi
# update berikutnya harus uninstall dulu).
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Siapkan keystore (kalau secrets tersedia)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KOPIDRIP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kopidrip.p12"
            echo "path=$RUNNER_TEMP/kopidrip.p12" >> "$GITHUB_OUTPUT"
            echo "Keystore ditemukan — build RELEASE bertanda tangan."
          else
            echo "Secrets keystore belum diisi — build DEBUG."
          fi

      - name: Build APK release
        if: steps.keystore.outputs.path != ''
        working-directory: android
        env:
          KOPIDRIP_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KOPIDRIP_KEYSTORE_PASSWORD: ${{ secrets.KOPIDRIP_KEYSTORE_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          mkdir -p ../apk-out
          cp app/build/outputs/apk/release/app-release.apk "../apk-out/KopiDripKasir-v1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Build APK debug
        if: steps.keystore.outputs.path == ''
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon
          mkdir -p ../apk-out
          cp app/build/outputs/apk/debug/app-debug.apk "../apk-out/KopiDripKasir-v1.0.${GITHUB_RUN_NUMBER}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: KopiDripKasir-apk
          path: apk-out/*.apk
          retention-days: 30
